services:

  orchestrator:
    build:
      context: ./orchestrator

    container_name: saga-orchestrator

    depends_on:
      - kafka

  order:
    build:
      context: ./order

    container_name: saga-order-orchestration

    depends_on:
      - kafka
      - orchestrator

  account:
    build:
      context: ./account

    container_name: saga-account-orchestration

    depends_on:
      - kafka
      - orchestrator

  product:
    build:
      context: ./product

    container_name: saga-product-orchestration

    depends_on:
      - kafka
      - orchestrator

  delivery:
    build:
      context: ./delivery

    container_name: saga-delivery-orchestration

    depends_on:
      - kafka
      - orchestrator

  kafka:
    image: apache/kafka:4.1.0

    container_name: saga-kafka-orchestration

    ports:
      - "9094:9092"

    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 2@kafka:9093

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1